name: Android Build and Release

on:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos al ejecutable de Gradle
      run: chmod +x gradlew

    - name: Compilar el APK (Debug)
      run: ./gradlew assembleDebug

    - name: Actualizar etiqueta "latest"
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -f latest
        git push -f origin latest

    - name: Publicar APK en Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "Actualización King System Pro"
        body: "Versión generada automáticamente."
        files: app/build/outputs/apk/debug/app-debug.apk
