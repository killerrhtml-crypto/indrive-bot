name: Android Build and Release

on:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos al ejecutable de Gradle
      run: chmod +x gradlew

    - name: Compilar el APK (Debug)
      run: ./gradlew assembleDebug

    - name: Limpiar Release y Tag anterior en GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest -y || true
        git push origin --delete latest || true
        git tag -d latest || true

    - name: Crear nueva etiqueta y Publicar en Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag latest
        git push origin latest

    - name: Subir APK al Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "King System Pro - Operador Activo"
        body: "Actualización automática generada desde el panel de control multiusuario."
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
